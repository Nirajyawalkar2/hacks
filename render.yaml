services:
  # ----------------------------------------------------
  # 1. PhishGuard Python Flask API Web Service
  # ----------------------------------------------------
  - type: web
    name: phishguard-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------
  # 2. PhishGuard React + Vite Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: phishguard-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: phishguard-backend
          property: host
